name: Build Used Mobile Tester APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Generate Android Project Structure
        run: |
          # Backup user lib and pubspec
          mkdir -p /tmp/backup_app
          cp pubspec.yaml /tmp/backup_app/
          cp -r lib /tmp/backup_app/

          # Create fresh Flutter project structure
          flutter create --org com.usedmobile.tester --project-name used_mobile_tester .

          # Restore user code
          cp /tmp/backup_app/pubspec.yaml .
          cp -r /tmp/backup_app/lib/* lib/

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Used-Mobile-Tester-APK
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
